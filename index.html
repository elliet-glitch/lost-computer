<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Lost Computer</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<main class="desktop" id="desktop">

    <!-- =========================
         DESKTOP ICONS
         ========================= -->

    <div class="desktop-icon" data-window="documents">
        <div class="icon">📁</div>
        <span>Documents</span>
    </div>

    <div class="desktop-icon" data-window="photos">
        <div class="icon">📷</div>
        <span>Photos</span>
    </div>

    <div class="desktop-icon" data-window="downloads">
        <div class="icon">📥</div>
        <span>Downloads</span>
    </div>

    <div class="desktop-icon" data-window="browser">
        <div class="icon">🌐</div>
        <span>Browser</span>
    </div>

    <div class="desktop-icon" data-window="notes">
        <div class="icon">📝</div>
        <span>Notes</span>
    </div>

    <div class="desktop-icon" data-window="trash">
        <div class="icon">🗑️</div>
        <span>Trash</span>
    </div>


    <!-- Hidden folder -->
    <div
        class="desktop-icon hidden-icon"
        id="archive-icon"
        data-window="archive"
    >
        <div class="icon">📁</div>
        <span>Archive</span>
    </div>


    <!-- =========================
         TASKBAR
         ========================= -->

    <div class="taskbar">

        <button class="start-button" id="start-button">
            Start
        </button>

        <div class="taskbar-status">
            <span id="connection-status">Connected</span>
            <span class="clock" id="clock">
                10:42 PM
            </span>
        </div>

    </div>

</main>


<!-- =========================
     START MENU
     ========================= -->

<div class="start-menu" id="start-menu">

    <div class="start-title">
        Lost Computer
    </div>

    <div class="start-item">
        <strong>System</strong>
        <span>Personal Computer</span>
    </div>

    <div class="start-item">
        <strong>Storage</strong>
        <span>128 GB</span>
    </div>

    <div class="start-item">
        <strong>Status</strong>
        <span>Last used recently</span>
    </div>

</div>


<script src="script.js"></script>

</body>
</html>
