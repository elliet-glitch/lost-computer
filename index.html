<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Desktop</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="desktop" id="desktop">

        <!-- =========================
             DESKTOP FILES
             ========================= -->

        <div class="desktop-item item-school"
             data-window="school">

            <div class="desktop-icon">
                📁
            </div>

            <span>school</span>

        </div>


        <div class="desktop-item item-photos"
             data-window="photos">

            <div class="desktop-icon">
                📷
            </div>

            <span>Photos</span>

        </div>


        <div class="desktop-item item-downloads"
             data-window="downloads">

            <div class="desktop-icon">
                📥
            </div>

            <span>Downloads</span>

        </div>


        <div class="desktop-item item-chrome"
             data-window="browser">

            <div class="desktop-icon">
                🌐
            </div>

            <span>Chrome</span>

        </div>


        <div class="desktop-item item-notes"
             data-window="notes">

            <div class="desktop-icon">
                📝
            </div>

            <span>Notes</span>

        </div>


        <div class="desktop-item item-trash"
             data-window="trash">

            <div class="desktop-icon">
                🗑️
            </div>

            <span>Trash</span>

        </div>


        <!-- =========================
             RANDOM LOOSE FILES
             ========================= -->

        <div class="desktop-item loose-file file-resume"
             data-file="resume_FINAL2.pdf">

            <div class="file-icon">
                📄
            </div>

            <span>resume_FINAL2.pdf</span>

        </div>


        <div class="desktop-item loose-file file-screenshot"
             data-file="Screenshot_2024-10-17.png">

            <div class="file-icon">
                🖼️
            </div>

            <span>Screenshot_2024-10-17.png</span>

        </div>


        <div class="desktop-item loose-file file-untitled"
             data-file="Untitled.docx">

            <div class="file-icon">
                📄
            </div>

            <span>Untitled.docx</span>

        </div>


        <div class="desktop-item loose-file file-final"
             data-file="final_FINAL.pdf">

            <div class="file-icon">
                📄
            </div>

            <span>final_FINAL.pdf</span>

        </div>


        <!-- =========================
             TASKBAR
             ========================= -->

        <div class="taskbar">

            <button
                class="start-button"
                id="start-button">

                ▣ Start

            </button>


            <div class="taskbar-center">

                <span id="system-message">
                    Ready
                </span>

            </div>


            <div class="taskbar-right">

                <span>
                    🔊
                </span>

                <span>
                    Wi-Fi
                </span>

                <span id="clock">
                    10:42 PM
                </span>

            </div>

        </div>

    </main>


    <!-- =========================
         START MENU
         ========================= -->

    <div
        class="start-menu"
        id="start-menu">

        <div class="start-header">

            <strong>
                Personal Computer
            </strong>

            <span>
                User
            </span>

        </div>


        <div class="start-section">

            <div class="start-entry">
                📁 Documents
            </div>

            <div class="start-entry">
                🌐 Browser
            </div>

            <div class="start-entry">
                ⚙ Settings
            </div>

        </div>


        <div class="start-footer">

            Last login:
            May 18

        </div>

    </div>


    <script src="script.js"></script>

</body>

</html>
