<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Lost Computer</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<main class="desktop">

    <!-- Desktop Icons -->

    <div class="desktop-icon" data-window="documents">
        <div class="icon">📁</div>
        <span>Documents</span>
    </div>

    <div class="desktop-icon" data-window="photos">
        <div class="icon">📷</div>
        <span>Photos</span>
    </div>

    <div class="desktop-icon" data-window="downloads">
        <div class="icon">📥</div>
        <span>Downloads</span>
    </div>

    <div class="desktop-icon" data-window="browser">
        <div class="icon">🌐</div>
        <span>Browser</span>
    </div>

    <div class="desktop-icon" data-window="notes">
        <div class="icon">📝</div>
        <span>Notes</span>
    </div>

    <div class="desktop-icon" data-window="trash">
        <div class="icon">🗑️</div>
        <span>Trash</span>
    </div>


    <!-- Taskbar -->

    <div class="taskbar">

        <div class="start-button">
            Start
        </div>

        <div class="clock" id="clock">
            10:42 PM
        </div>

    </div>

</main>

<script src="script.js"></script>

</body>
</html>
